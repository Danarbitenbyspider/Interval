name: intervals_training
description: Aplikasi interval training low-impact dengan 5 mode berbeda
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  shared_preferences: ^2.2.3

  # Haptics
  vibration: ^1.8.4

  # Localization
  intl: ^0.18.1

  # Utils
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/workouts.json
    - assets/i18n/id.json
    - assets/i18n/en.json
